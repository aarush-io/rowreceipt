name: Dependency audit
on:
  push:
    paths: [pyproject.toml, ".github/workflows/dependencies.yml"]
  pull_request:
    paths: [pyproject.toml, ".github/workflows/dependencies.yml"]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit required Python packages against OSV
        run: |
          python -m pip install pip-audit==2.10.0
          python -c 'import pathlib,tomllib; d=tomllib.loads(pathlib.Path("pyproject.toml").read_text()); pathlib.Path("audit-requirements.txt").write_text("\n".join(d["build-system"]["requires"] + d["project"]["dependencies"]) + "\n")'
          python -m pip_audit --vulnerability-service osv --strict --requirement audit-requirements.txt
