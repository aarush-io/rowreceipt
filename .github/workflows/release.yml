name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -W error::ResourceWarning -m unittest discover
      - run: python scripts/build_release.py --out dist
      - run: python examples/demo.py --app dist/*.pyz
        shell: bash
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_DATE_EPOCH: "1795737600"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate tag and version
        run: |
          python -c 'import os,tomllib; from rowreceipt import __version__; assert "v"+__version__==os.environ["GITHUB_REF_NAME"] and __version__==tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - name: Build and verify release twice
        run: |
          python -m pip install "setuptools==84.2.1" "wheel==0.48.0"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/build_release.py --out dist
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir rebuilt .
          python scripts/build_release.py --out rebuilt
          diff -r dist rebuilt
          (cd dist && sha256sum --check SHA256SUMS)
          python -m venv /tmp/rowreceipt-release
          /tmp/rowreceipt-release/bin/python -m pip install --no-index --no-deps dist/*.whl
          (cd /tmp && /tmp/rowreceipt-release/bin/rowreceipt --version)
          (cd /tmp && /tmp/rowreceipt-release/bin/python "$GITHUB_WORKSPACE/examples/demo.py")
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.pyz dist/*.zip dist/*.whl dist/SHA256SUMS
