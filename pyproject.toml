[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rowreceipt"
version = "0.1.0"
description = "Compare SQLite and CSV datasets without transferring rows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Utilities",
]

[project.scripts]
rowreceipt = "rowreceipt.cli:main"

[tool.setuptools]
packages = ["rowreceipt"]
